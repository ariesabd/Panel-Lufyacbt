name: Build LufyaCBT Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Panel Build LufyaCBT.exe
    runs-on: windows-2022

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Visual Studio MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Generate Official Windows Platform Runner
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=lufyacbt .
          flutter doctor -v

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🎨 Apply Custom App Icon (Override Flutter Default)
        shell: pwsh
        run: |
          # Step 1: Copy custom .ico ke windows/runner/resources (SETELAH flutter create)
          $iconSrc = "assets\icons\app_icon.ico"
          $iconDst = "windows\runner\resources\app_icon.ico"

          if (Test-Path $iconSrc) {
            New-Item -ItemType Directory -Path "windows\runner\resources" -Force | Out-Null
            Copy-Item $iconSrc $iconDst -Force
            Write-Host "✅ Custom icon copied to $iconDst"
          } else {
            Write-Error "❌ $iconSrc not found! Build will use Flutter default icon."
            exit 1
          }

          # Step 2: Patch Runner.rc agar menunjuk ke app_icon.ico kustom
          $rcFile = "windows\runner\Runner.rc"
          if (Test-Path $rcFile) {
            $rcContent = Get-Content $rcFile -Raw
            # Ganti icon reference Flutter default dengan icon kustom kita
            $rcPatched = $rcContent -replace 'IDI_APP_ICON\s+ICON\s+"[^"]*"', 'IDI_APP_ICON             ICON             "resources\app_icon.ico"'
            if ($rcPatched -ne $rcContent) {
              Set-Content $rcFile $rcPatched -Encoding UTF8
              Write-Host "✅ Runner.rc patched: IDI_APP_ICON => resources\app_icon.ico"
            } else {
              Write-Warning "Runner.rc already has correct icon path or pattern not found."
              Write-Host "--- Runner.rc content ---"
              Get-Content $rcFile
            }
          } else {
            Write-Warning "Runner.rc not found, skipping patch."
          }

          # Step 3: Jalankan flutter_launcher_icons untuk sync icon dari pubspec
          Write-Host "🔄 Running flutter_launcher_icons..."
          dart run flutter_launcher_icons

          # Step 4: Re-copy icon lagi setelah flutter_launcher_icons (berjaga-jaga jika di-reset)
          Copy-Item $iconSrc $iconDst -Force
          Write-Host "✅ Custom icon re-applied after flutter_launcher_icons"

      - name: 🔨 Build Flutter Windows Release
        run: flutter build windows --release

      - name: 🔍 Verify Built .exe Icon
        shell: pwsh
        run: |
          # Tampilkan info build untuk verifikasi
          $exeFiles = Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe"
          foreach ($exe in $exeFiles) {
            Write-Host "Found EXE: $($exe.FullName) | Size: $($exe.Length) bytes"
          }
          # Verifikasi icon resource ada
          if (Test-Path "windows\runner\resources\app_icon.ico") {
            $ico = Get-Item "windows\runner\resources\app_icon.ico"
            Write-Host "✅ Icon resource: $($ico.FullName) | Size: $($ico.Length) bytes"
          }

      - name: 🗜️ Archive Windows Release Bundle
        shell: pwsh
        run: |
          # Accurately locate the real Flutter Release directory containing flutter_windows.dll
          $bundleDir = Get-ChildItem -Path "build\windows" -Recurse -Directory | Where-Object {
            (Test-Path (Join-Path $_.FullName "flutter_windows.dll")) -or
            (Test-Path (Join-Path $_.FullName "data"))
          } | Select-Object -First 1

          if ($bundleDir) {
            Write-Host "Found TRUE Flutter Windows Release Bundle at: $($bundleDir.FullName)"

            # Ensure the primary executable is named LufyaCBT.exe
            $exeFile = Get-ChildItem -Path $bundleDir.FullName -Filter "*.exe" | Select-Object -First 1
            if ($exeFile) {
              if ($exeFile.Name -ne "LufyaCBT.exe") {
                Write-Host "Renaming $($exeFile.Name) to LufyaCBT.exe"
                Rename-Item -Path $exeFile.FullName -NewName "LufyaCBT.exe" -Force
              }
            }

            Get-ChildItem -Path $bundleDir.FullName
            Compress-Archive -Path "$($bundleDir.FullName)\*" -DestinationPath "LufyaCBT-Windows-x64.zip" -Force
            Write-Host "Successfully packaged LufyaCBT-Windows-x64.zip"
          } else {
            Write-Error "Flutter release bundle containing flutter_windows.dll not found!"
            exit 1
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LufyaCBT-Windows-x64
          path: LufyaCBT-Windows-x64.zip
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: LufyaCBT-Windows-x64.zip
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

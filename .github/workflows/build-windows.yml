name: Build Panel LufyaCBT Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Panel Build Windows Release
    runs-on: windows-2022

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Visual Studio MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Generate Official Windows Platform Runner
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=panel_lufyacbt .
          flutter doctor -v

      - name: 📦 Install Dependencies
        run: |
          flutter pub get

      - name: 🔨 Build Flutter Windows Release
        run: |
          flutter build windows --release

      - name: 🗜️ Archive Windows Release Bundle
        shell: pwsh
        run: |
          # Locate the runner directory that contains the compiled .exe file
          $exeFile = Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            $runnerDir = $exeFile.Directory.FullName
            Write-Host "Found compiled executable at: $($exeFile.FullName)"
            Write-Host "Target bundle directory: $runnerDir"
            Get-ChildItem -Path $runnerDir
            Compress-Archive -Path "$runnerDir\*" -DestinationPath "Panel-LufyaCBT-Windows-x64.zip" -Force
            Write-Host "Successfully packaged Panel-LufyaCBT-Windows-x64.zip"
          } else {
            Write-Error "No .exe file found in build\windows directory!"
            exit 1
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panel-LufyaCBT-Windows-x64
          path: Panel-LufyaCBT-Windows-x64.zip
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: Panel-LufyaCBT-Windows-x64.zip
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build LufyaCBT Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Panel Build LufyaCBT.exe
    runs-on: windows-2022

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Visual Studio MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Generate Official Windows Platform Runner
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=lufyacbt .
          flutter doctor -v

      - name: 📦 Install Dependencies & Generate Icons
        shell: pwsh
        run: |
          flutter pub get
          # flutter_launcher_icons akan generate app_icon.ico dari app_icon.png
          # dan menempatkannya di windows\runner\resources\app_icon.ico secara otomatis
          dart run flutter_launcher_icons
          Write-Host "✅ flutter_launcher_icons selesai"

          # Verifikasi icon berhasil di-generate
          if (Test-Path "windows\runner\resources\app_icon.ico") {
            $ico = Get-Item "windows\runner\resources\app_icon.ico"
            Write-Host "✅ Icon OK: $($ico.FullName) | Size: $($ico.Length) bytes"
          } else {
            Write-Warning "⚠️ app_icon.ico belum ada, fallback copy dari assets..."
            New-Item -ItemType Directory -Path "windows\runner\resources" -Force | Out-Null
            if (Test-Path "assets\icons\app_icon.ico") {
              Copy-Item "assets\icons\app_icon.ico" "windows\runner\resources\app_icon.ico" -Force
              Write-Host "✅ Fallback: Custom icon copied from assets\icons\app_icon.ico"
            }
          }

          # Tampilkan Runner.rc untuk verifikasi path icon
          if (Test-Path "windows\runner\Runner.rc") {
            Write-Host "--- Runner.rc icon lines ---"
            Get-Content "windows\runner\Runner.rc" | Select-String "ICO|ICON"
          }

      - name: 🔨 Build Flutter Windows Release
        run: flutter build windows --release

      - name: 🗜️ Archive Windows Release Bundle
        shell: pwsh
        run: |
          # Accurately locate the real Flutter Release directory containing flutter_windows.dll
          $bundleDir = Get-ChildItem -Path "build\windows" -Recurse -Directory | Where-Object {
            (Test-Path (Join-Path $_.FullName "flutter_windows.dll")) -or
            (Test-Path (Join-Path $_.FullName "data"))
          } | Select-Object -First 1

          if ($bundleDir) {
            Write-Host "Found TRUE Flutter Windows Release Bundle at: $($bundleDir.FullName)"

            # Ensure the primary executable is named LufyaCBT.exe
            $exeFile = Get-ChildItem -Path $bundleDir.FullName -Filter "*.exe" | Select-Object -First 1
            if ($exeFile) {
              if ($exeFile.Name -ne "LufyaCBT.exe") {
                Write-Host "Renaming $($exeFile.Name) to LufyaCBT.exe"
                Rename-Item -Path $exeFile.FullName -NewName "LufyaCBT.exe" -Force
              }
            }

            Get-ChildItem -Path $bundleDir.FullName
            Compress-Archive -Path "$($bundleDir.FullName)\*" -DestinationPath "LufyaCBT-Windows-x64.zip" -Force
            Write-Host "Successfully packaged LufyaCBT-Windows-x64.zip"
          } else {
            Write-Error "Flutter release bundle containing flutter_windows.dll not found!"
            exit 1
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LufyaCBT-Windows-x64
          path: LufyaCBT-Windows-x64.zip
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: LufyaCBT-Windows-x64.zip
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

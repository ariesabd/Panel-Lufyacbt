name: Build LufyaCBT Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Panel Build LufyaCBT.exe
    runs-on: windows-2022

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Visual Studio MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Generate Official Windows Platform Runner
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=lufyacbt .
          flutter doctor -v

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🎨 Embed Custom App Icon Into Windows Runner
        shell: pwsh
        run: |
          $iconSrc = "assets\icons\app_icon.ico"
          $iconDst = "windows\runner\resources\app_icon.ico"

          # Pastikan source icon ada
          if (-not (Test-Path $iconSrc)) {
            Write-Error "❌ Source icon tidak ditemukan: $iconSrc"
            exit 1
          }

          # Buat folder resources jika belum ada
          New-Item -ItemType Directory -Path "windows\runner\resources" -Force | Out-Null

          # STEP 1: Hard copy icon kustom ke resources (override Flutter default)
          Copy-Item $iconSrc $iconDst -Force
          $icoInfo = Get-Item $iconDst
          Write-Host "✅ [STEP 1] Icon kustom disalin: $($icoInfo.Length) bytes"

          # STEP 2: Verifikasi Runner.rc menunjuk ke path yang benar
          $rcFile = "windows\runner\Runner.rc"
          if (Test-Path $rcFile) {
            Write-Host "--- Runner.rc (icon section) ---"
            Get-Content $rcFile | Select-String "ICO|ICON|app_icon"
          }

          # STEP 3: Run flutter_launcher_icons (generate dari pubspec)
          Write-Host "🔄 Running flutter_launcher_icons..."
          dart run flutter_launcher_icons
          Write-Host "✅ [STEP 3] flutter_launcher_icons done"

          # STEP 4: PAKSA copy ulang icon kustom kita
          # (flutter_launcher_icons mungkin overwrite dengan hasil generate-nya sendiri)
          Copy-Item $iconSrc $iconDst -Force
          $icoFinal = Get-Item $iconDst
          Write-Host "✅ [STEP 4] Icon kustom di-force copy ulang: $($icoFinal.Length) bytes"

          # STEP 5: Tampilkan hash MD5 sebagai bukti icon kita yang digunakan
          $hash = (Get-FileHash $iconDst -Algorithm MD5).Hash
          $srcHash = (Get-FileHash $iconSrc -Algorithm MD5).Hash
          Write-Host "🔑 MD5 source   : $srcHash"
          Write-Host "🔑 MD5 resources: $hash"
          if ($hash -eq $srcHash) {
            Write-Host "✅ CONFIRMED: Icon di resources = icon kustom kita!"
          } else {
            Write-Error "❌ Hash tidak cocok! Icon resources berbeda dengan source."
            exit 1
          }

      - name: 🔨 Build Flutter Windows Release
        run: flutter build windows --release

      - name: 🗜️ Archive Windows Release Bundle
        shell: pwsh
        run: |
          # Accurately locate the real Flutter Release directory containing flutter_windows.dll
          $bundleDir = Get-ChildItem -Path "build\windows" -Recurse -Directory | Where-Object {
            (Test-Path (Join-Path $_.FullName "flutter_windows.dll")) -or
            (Test-Path (Join-Path $_.FullName "data"))
          } | Select-Object -First 1

          if ($bundleDir) {
            Write-Host "Found TRUE Flutter Windows Release Bundle at: $($bundleDir.FullName)"

            # Ensure the primary executable is named LufyaCBT.exe
            $exeFile = Get-ChildItem -Path $bundleDir.FullName -Filter "*.exe" | Select-Object -First 1
            if ($exeFile) {
              if ($exeFile.Name -ne "LufyaCBT.exe") {
                Write-Host "Renaming $($exeFile.Name) to LufyaCBT.exe"
                Rename-Item -Path $exeFile.FullName -NewName "LufyaCBT.exe" -Force
              }
            }

            Get-ChildItem -Path $bundleDir.FullName
            Compress-Archive -Path "$($bundleDir.FullName)\*" -DestinationPath "LufyaCBT-Windows-x64.zip" -Force
            Write-Host "Successfully packaged LufyaCBT-Windows-x64.zip"
          } else {
            Write-Error "Flutter release bundle containing flutter_windows.dll not found!"
            exit 1
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LufyaCBT-Windows-x64
          path: LufyaCBT-Windows-x64.zip
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: LufyaCBT-Windows-x64.zip
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

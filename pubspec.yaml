name: panel_lufyacbt
description: "Panel CBT Proktor Desktop Application (.exe) for Lufya CBT"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  webview_windows: ^0.4.0
  url_launcher: ^6.2.4
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
